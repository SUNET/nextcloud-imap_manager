name: Lint JS

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-js-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  js-lint:
    name: js-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint || ( echo 'Please run `npm run lint:fix` to fix lint errors' && exit 1 )

      - name: Stylelint
        run: npm run stylelint || ( echo 'Please run `npm run stylelint:fix` to fix style errors' && exit 1 )
